parameters:
    strichliste:

        bank:
          name: "test_bank"
          limit: 1000
        article:
            enabled: true
            autoOpen: true
            serach: true

        common:
            idleTimeout: 10000 # Time in ms

        paypal:
            enabled: false
            recipient: "foo@bar.de"
            fee: 0

        user:
            stalePeriod: '14 day' # See http://de.php.net/manual/en/datetime.formats.relative.php

        i18n:
            dateFormat: 'YYYY-MM-DD HH:mm:ss'
            timezone: 'auto'
            language: 'en'
            currency:
                name: 'Euro'
                symbol: '€'
                alpha3: 'EUR'

        account:
            boundary:
                upper: 20000
                lower: -200

        # Be aware: All amounts are in cents!
        payment:
            undo:
                enabled: true
                delete: false
                timeout: '1 hour' # See http://de.php.net/manual/en/datetime.formats.relative.php

            boundary:
                upper: 10000
                lower: -10000

            transactions:
                enabled: true

            splitInvoice:
                enabled: false

            deposit:
                enabled: true
                custom: false
                steps:
                    - 100
                    - 200
                    - 500
                    - 1000
                    - 2000
                    - 5000

            dispense:
                enabled: false
                custom: false
                steps:
                    - 100
